name: Quality gates
description: Format, lint, type-check, check the generated docs and run the tests.

inputs:
  static:
    description: Run the format, lint, type and generated-docs gates.
    required: false
    default: "true"
  tests:
    description: Run the test suite.
    required: false
    default: "true"
  coverage:
    description: Measure coverage, enforce the floor and write coverage.xml.
    required: false
    default: "false"
  audit:
    description: Audit the locked dependencies with pip-audit.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Formatting
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync ruff format --check .
    - name: Lint
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync ruff check .
    - name: Types
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync mypy
    - name: Types (Windows)
      if: inputs.static == 'true'
      shell: bash
      # Run on Linux too: ctypes.windll and the Win32 stubs are otherwise only checked by Nightly.
      run: uv run --locked --no-sync mypy --platform win32
    - name: Generated settings reference
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync python scripts/gen_settings_doc.py --check
    - name: Tests
      if: inputs.tests == 'true' && inputs.coverage != 'true'
      shell: bash
      run: uv run --locked --no-sync pytest -q -W error
    - name: Tests with coverage
      if: inputs.tests == 'true' && inputs.coverage == 'true'
      shell: bash
      # The floor lives in pyproject.toml, so a local run enforces the same number as CI.
      run: uv run --locked --no-sync pytest -q -W error --cov --cov-report=term-missing --cov-report=xml
    - name: Dependency audit
      if: inputs.audit == 'true'
      shell: bash
      run: |
        uv export --locked --all-extras --no-hashes --format requirements-txt \
          > "$RUNNER_TEMP/requirements-audit.txt"
        uv run --locked --no-sync pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" \
          --no-deps --disable-pip --desc
