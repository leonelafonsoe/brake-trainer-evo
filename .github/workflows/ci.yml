name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --extra dev
      - uses: ./.github/actions/gates
        with:
          tests: "false"

  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          # One Windows leg is enough to catch a Windows-only failure; the Python matrix runs on
          # Linux, where the extra leg is cheap.
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --extra dev
      - uses: ./.github/actions/gates
        with:
          static: "false"
          # Measure once, on the leg that is always present; the other legs just run the tests.
          coverage: ${{ runner.os == 'Linux' && matrix.python-version == '3.12' }}

      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Every pull request gets a Windows build to try out: open the run's page and download the
  # artifact. Nothing is published from here. It waits for both the checks and the tests, so a
  # Windows-only failure blocks the build too.
  windows-build:
    needs: [checks, tests]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - name: Build the executable
        env:
          BRAKE_TRAINER_BUILD: ${{ github.sha }}
        run: uv run --frozen --no-sync python scripts/build_exe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BrakeTrainerEvo-windows-${{ github.sha }}
          path: dist/BrakeTrainerEvo-*-windows.zip
          retention-days: 14
