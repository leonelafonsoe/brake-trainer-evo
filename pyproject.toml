[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brake-trainer-evo"
version = "0.4.0"
description = "Braking-point trainer with audio cues for Assetto Corsa EVO"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["assetto-corsa-evo", "sim-racing", "telemetry", "braking"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.10"
# acevo-sdk 0.2.0 withholds frames until a clean lap boundary, which starves the live overlay.
dependencies = ["PySide6>=6.6", "acevo-sdk>=0.1.1,<0.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.6"]

[project.gui-scripts]
brake-trainer = "brake_trainer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["acevo", "acevo.*", "winsound"]
ignore_missing_imports = true
