name: Security

# Audit the exact locked dependencies weekly, and whenever the dependency set changes. The scan is
# against the exported lockfile, so it does not depend on whatever happens to be installed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - uv.lock
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - name: Audit the locked requirements
        run: |
          uv export --locked --all-extras --no-hashes --format requirements-txt \
            > "$RUNNER_TEMP/requirements-audit.txt"
          uv run --locked --no-sync pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" \
            --no-deps --disable-pip --desc
