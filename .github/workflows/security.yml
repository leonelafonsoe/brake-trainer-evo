name: Security

# Audit the exact locked dependencies weekly, and whenever the dependency set changes. The scan is
# against the exported lockfile, so it does not depend on whatever happens to be installed.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - uv.lock
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - name: Audit the locked requirements
        run: |
          uv export --frozen --all-extras --no-hashes --format requirements-txt \
            > "$RUNNER_TEMP/requirements-audit.txt"
          uv run --frozen --no-sync pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" \
            --no-deps --disable-pip --desc
