name: Release

# Publishes a GitHub release when a version tag is pushed:
#   git tag v0.3.8 && git push origin v0.3.8
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Check the tag, the version and the changelog
        run: python scripts/release_notes.py --tag "${{ github.ref_name }}" --check

      - name: Lint, types, tests
        uses: ./.github/actions/gates

      - name: Build the executable
        env:
          BRAKE_TRAINER_BUILD: ${{ github.sha }}
        run: python scripts/build_exe.py

      - name: Read the version
        id: version
        run: |
          $v = python -c "from brake_trainer import __version__; print(__version__)"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the installer
        id: installer
        run: |
          choco install innosetup --no-progress -y
          # The package's major version and install location can change: find the compiler rather
          # than assuming "Inno Setup 6" under Program Files (x86).
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found" }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Checksums
        run: |
          $zip = @(Get-ChildItem dist\BrakeTrainerEvo-*-windows.zip)
          $setup = @(Get-ChildItem dist\BrakeTrainerEvo-*-setup.exe)
          if ($zip.Count -ne 1) { throw "Expected exactly one portable zip, found $($zip.Count)" }
          if ($setup.Count -ne 1) { throw "Expected exactly one installer, found $($setup.Count)" }

          $lines = @($zip[0], $setup[0]) | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

          # Read the file back and verify it: publishing a checksum that does not match is worse
          # than publishing no checksum at all.
          $sums = @(Get-Content dist\SHA256SUMS.txt)
          if ($sums.Count -ne 2) { throw "Expected 2 checksum lines, found $($sums.Count)" }
          foreach ($line in $sums) {
            $hash, $name = $line -split "\s+", 2
            $file = Join-Path dist $name
            if (-not (Test-Path $file)) { throw "Checksum names a missing file: $name" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              throw "Checksum mismatch: $name"
            }
          }

      - name: Assert the release assets
        run: |
          $version = "${{ steps.version.outputs.value }}"
          foreach ($name in @("BrakeTrainerEvo-$version-windows.zip", "BrakeTrainerEvo-$version-setup.exe", "SHA256SUMS.txt")) {
            $path = Join-Path dist $name
            if (-not (Test-Path $path)) { throw "Missing release asset: $name" }
            if ((Get-Item $path).Length -eq 0) { throw "Empty release asset: $name" }
          }

      - name: Write the release notes
        run: |
          python scripts/release_notes.py --tag "${{ github.ref_name }}" --repo "${{ github.repository }}" --out release_notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Brake Trainer EVO ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/BrakeTrainerEvo-${{ steps.version.outputs.value }}-windows.zip
            dist/BrakeTrainerEvo-${{ steps.version.outputs.value }}-setup.exe
            dist/SHA256SUMS.txt
