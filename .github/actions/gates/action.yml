name: Quality gates
description: Format, lint, type-check, check the generated docs and run the tests.

inputs:
  static:
    description: Run the format, lint, type and generated-docs gates.
    required: false
    default: "true"
  tests:
    description: Run the test suite.
    required: false
    default: "true"
  coverage:
    description: Measure coverage, enforce the floor and write coverage.xml.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Formatting
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync ruff format --check .
    - name: Lint
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync ruff check .
    - name: Types
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync mypy
    - name: Generated settings reference
      if: inputs.static == 'true'
      shell: bash
      run: uv run --locked --no-sync python scripts/gen_settings_doc.py --check
    - name: Tests
      if: inputs.tests == 'true' && inputs.coverage != 'true'
      shell: bash
      run: uv run --locked --no-sync pytest -q -W error
    - name: Tests with coverage
      if: inputs.tests == 'true' && inputs.coverage == 'true'
      shell: bash
      # The floor lives in pyproject.toml, so a local run enforces the same number as CI.
      run: uv run --locked --no-sync pytest -q -W error --cov --cov-report=term-missing --cov-report=xml
