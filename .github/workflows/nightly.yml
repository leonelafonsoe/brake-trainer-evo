name: Nightly

# After every change to main (for example a merged pull request), refresh a rolling
# "nightly" pre-release with a fresh Windows build, so the newest changes can be tried
# without waiting for a versioned release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev

      # The same gates as CI, so a nightly can never publish code that would fail a pull request.
      - uses: ./.github/actions/gates
        with:
          coverage: "true"
          audit: "true"

      - name: Build the executable
        env:
          BRAKE_TRAINER_BUILD: ${{ github.sha }}
        run: uv run --locked --no-sync python scripts/build_exe.py

      - name: Smoke-test the packaged app
        run: uv run --locked --no-sync python scripts/smoke_test_exe.py dist/BrakeTrainerEvo/BrakeTrainerEvo.exe

      - name: Name the asset
        run: Copy-Item (Get-ChildItem dist\BrakeTrainerEvo-*-windows.zip).FullName dist\BrakeTrainerEvo-nightly-windows.zip

      - name: Write the notes
        run: uv run --locked --no-sync python scripts/release_notes.py --unreleased --sha "${{ github.sha }}" --repo "${{ github.repository }}" --out nightly_notes.md

      - name: Move the nightly tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push -f origin nightly

      - name: Publish the nightly pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          name: Nightly (latest main)
          body_path: nightly_notes.md
          prerelease: true
          files: dist/BrakeTrainerEvo-nightly-windows.zip
